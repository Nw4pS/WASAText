openapi: 3.0.0
servers:
  - url: "http://localhost:3000"
info:
  title: WASAText API
  description: API per WASAText
  version: 1.0.0

paths:
  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      description: effettua il login tramite l'username, se l'utente non esistesse, verrà creato automaticamente
      operationId: doLogin
      requestBody:
        description: User details
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: Maria
                  minLength: 3
                  maxLength: 16
      responses:
        '201':
          description: User log-in action successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  identifier:
                    type: string
                    example: "abcdef012345"

  /users:
    get:
      tags: ["users"]
      summary: Cerca o elenca utenti
      description: restituisce una lista di utenti, nel caso in cui nella query venga inserito un username, verrà restituito solo l'utente con quell'username
      operationId: searchUsers
      security:
        - BearerAuth: []
      parameters:
      - name: username
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Lista utenti restituita
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    username:
                      type: string
                      description: username dell'utente
                    proPic:
                      type: string
                      description: foto profilo dell'utente

  /users/me/name:
    put:
      tags: ["users"]
      summary: Aggiorna il nome utente
      description: aggiorna l'username con una stringa compresa tra 3 e 16 caratteri. lo username non deve essere già in uso
      operationId: setMyUserName
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 16
              required:
                - name
      responses:
        '204':
          description: Nome aggiornato con successo
        '400': 
          $ref: "#/components/responses/BadRequest"

  /users/me/propic:
    put:
      tags: ["users"]
      summary: cambia foto profilo
      description: cambia la foto profilo tramite una stringa codificata in Base64
      operationId: setMyPhoto
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                picture:
                  type: string
              required:
                - picture
      responses:
        '204':
          description: Foto aggiornata

  /conversations:
    get:
      tags: ["conversations"]
      summary: ricevi lista di conversazioni
      description: ricevi la lista delle conversazioni di gruppo o dirette a cui l'utente ha accesso. Le conversazioni sono ordinate in senso cronologico inverso in base all'ultimo messaggio
      operationId: getMyConversations
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Conversazioni ritornate con successo
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: id della conversazione (ID utente o ID gruppo)
                    name:
                      type: string
                      description: nome della conversazione (altro utente o gruppo)
                    picture:
                      type: string
                    lastMessageDate:
                      type: string
                      format: date-time
                    lastMessagePreview:
                      type: string
                    isGroup:
                      type: boolean
    post:
      tags: ["conversations"]
      summary: crea o recupera una chat diretta con un utente
      description: crea o recupera una chat diretta con un utente tramite il suo username, aggiungendo automaticamente la conversazione alla lista di conversazioni
      operationId: createConversation
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: l'username dell'utente con cui avviare la chat
              required:
                - username
      responses:
        '201':
          description: Conversazione creata o già esistente
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: L'ID della conversazione

  /conversations/{id}/messages:
    parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
    get:
      tags: ["messages"]
      summary: Ottieni tutti i messaggi di una conversazione
      description: ottieni tutti i messaggi della conversazione in ordine cronologico inverso in base all'istante di invio del messaggio.
      operationId: getConversation
      security:
        - BearerAuth: []
      
      responses:
        '200':
          description: Messaggi restituiti
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    user:
                      type: string
                    conversation:
                      type: integer
                    timestamp:
                      type: string
                      format: date-time
                    content:
                      type: string
                    isImage:
                      type: boolean
                    isForwarded:
                      type: boolean
                    isAnswer:
                      type: boolean
                    answerTo:
                      type: integer
                    isDeleted:
                      type: boolean
                    state:
                      type: string
                      enum:
                      - sent
                      - received
                      - read
                    reactions:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          user:
                            type: string
                          content:
                            type: string
                            description: emoji usata per la reazione
                            example: "👍"
                            minLength: 1
                            maxLength: 8
    post:
      tags: ["messages"]
      summary: Invia un messaggio
      description: Invia un nuovo messaggio di testo o immagine all'interno della conversazione, include informazioni riguardo a se il messaggio è una risposta ad un messaggio esistente
      operationId: sendMessage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                isImage:
                  type: boolean
                replyTo:
                  type: integer
                  description: ID del messaggio a cui si sta rispondendo
              required:
                - content
      responses:
        '201':
          description: Messaggio inviato
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: id del messaggio generato

  /conversations/{id}/messages/forward:
    parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
    post:
      tags: ["messages"]
      summary: Inoltra un messaggio esistente in questa conversazione
      description: inoltra un messaggio esistente, esso verrà considerato come un nuovo messaggio, anche se vengono mantenute le informazioni riguardo al messaggio originale
      operationId: forwardMessage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messageId:
                  type: integer
                  description: L'ID del messaggio originale da inoltrare
              required:
                - messageId
      responses:
        '201':
          description: Messaggio inoltrato
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: id del messaggio inoltrato

  /messages/{id}:
    parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
    delete:
      tags: ["messages"]
      summary: Elimina un messaggio
      description: elimina un messaggio inviato solamente se l'utente che richiede l'eliminazione è lo stesso che ha inviato il messaggio
      operationId: deleteMessage
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Messaggio eliminato

  /messages/{id}/reactions:
    parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
    put:
      tags: ["messages"]
      summary: Aggiungi una reazione a un messaggio
      description: aggiunge una reaction ad un messaggio, la reaction è una stringa rappresentante un emoji
      operationId: commentMessage
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              emoji:
                description: emoji usata per la reazione
                example: "👍"
                minLength: 1
                maxLength: 8
              required:
                - emoji
      responses:
        '204':
          description: Reazione aggiunta
    delete:
      tags: ["messages"]
      summary: Rimuovi la reazione dal messaggio
      description: rimuove la reaction al messaggio
      operationId: uncommentMessage
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Reazione rimossa

  /groups:
    post:
      tags: ["groups"]
      summary: Crea un nuovo gruppo
      description: crea un nuovo gruppo includendo un qualsiasi numero di utenti maggiore o uguale a uno, compreso l'utente che ha creato il gruppo
      operationId: createGroup
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                members:
                  type: array
                  items:
                    type: string
              required:
                - name
      responses:
        '201':
          description: Gruppo creato
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: id del gruppo creato

  /groups/{id}/name:
    parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
    put:
      tags: ["groups"]
      summary: modifica il nome del gruppo
      description: modifica il nome di un gruppo esistente
      operationId: setGroupName
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required:
                - name
      responses:
        '204':
          description: Nome aggiornato

  /groups/{id}/photo:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    put:
      tags: ["groups"]
      summary: Imposta foto del gruppo
      description: modifica la foto che rappresenta la conversazione di gruppo, utilizza una stringa in Base64
      operationId: setGroupPhoto
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                picture:
                  type: string
              required:
                - picture
      responses:
        '204':
          description: Foto aggiornata

  /groups/{id}/members:
    parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
    post:
      tags: ["groups"]
      summary: Aggiungi un utente al gruppo
      description: aggiunge un utente al gruppo, solo i membri del gruppo possono aggiungere altri utenti
      operationId: addToGroup
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
              required:
                - username
      responses:
        '204':
          description: Utente aggiunto

  /groups/{id}/members/me:
    parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
    delete:
      tags: ["groups"]
      summary: Abbandona il gruppo
      description: permette all'utente di abbandonare il gruppo
      operationId: leaveGroup
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Uscito dal gruppo con successo

components:
  schemas:
    StatusInfo:
      title: Status Info
      type: object
      properties:
        status:
          type: string
          enum:
            - info
            - warning
            - critical
            - ""
        title: { type: string }
        message: { type: string }
        url: { type: string }

  responses:
    Unauthorized:
      description: The access token is missing or it's expired
    BadRequest:
      description: The request was not compliant with the documentation (eg. missing fields, etc)
    InternalServerError:
      description: The server encountered an internal error. Further info in server logs

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  parameters:
    XAppVersion:
      schema:
        type: string
        pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
        minLength: 1
        maxLength: 10
      name: X-App-Version
      in: header
      required: true
      description: App human readable version ("semantic version" format)
      allowEmptyValue: false
    XAppBuild:
      schema: { type: integer }
      name: X-App-Build
      in: header
      required: true
      description: App build number
      allowEmptyValue: false
    XAppLanguage:
      schema:
        type: string
        pattern: '^[a-z]{2}([-_][A-Z]{2})?$'
        minLength: 2
        maxLength: 5
      name: X-App-Language
      in: header
      required: true
      description: App language in ISO 639-1 format
      allowEmptyValue: false
    XAppPlatform:
      schema:
        type: string
        enum: [ios, android]
      name: X-App-Platform
      in: header
      required: true
      description: App operating system / platform
      allowEmptyValue: false
    cat:
      schema:
        type: string
        pattern: '^[a-zA-Z]+$'
        minLength: 3
        maxLength: 10
      name: cat
      in: path
      required: true
      description: Cat
      allowEmptyValue: false
